spring:
  # 로컬 개발용 .env 로드
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:Backend/.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 메일 발송. MAIL_HOST 미설정 시 JavaMailSender 빈이 만들어지지 않고,
  # 인증번호는 발송 대신 로그로 출력된다(로컬 개발용). 운영에서는 반드시 설정할 것.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000  # SMTP 연결 5초 타임아웃(포트 막힌 네트워크에서 무한 대기 방지)
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

# Swagger(springdoc) — 기본 잠금. 운영(CI/CD)에 API 문서가 노출되지 않도록 끄고,
# 로컬 개발에서만 SWAGGER_ENABLED=true로 켠다(SecurityConfig의 permitAll도 같은 플래그로 함께 열린다).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# RTC 접속 방식 전역 스위치 (-123): livekit | openvidu | mesh
# 통합 rtc-access 응답의 mode가 이 값으로 결정된다. 레거시 video-token은 항상 LiveKit 고정.
rtc:
  provider: ${RTC_PROVIDER:livekit}

# LiveKit(SFU) 접속 토큰 발급 (-30).
# api-key/api-secret은 로컬 LiveKit 컨테이너의 keys 설정과 반드시 일치해야 한다.
# 기본값은 로컬 개발 전용 — 운영은 LIVEKIT_* 환경변수로 주입(.env → CI).
livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:devsecret-local-only-0123456789abcdef}
  token-ttl: ${LIVEKIT_TOKEN_TTL:10m}

# OpenVidu(SFU) 접속 토큰 발급 (-123). 내부 엔진이 LiveKit라 설정 구성 동일 — URL·키만 별도.
# 기본값은 로컬 개발 전용(OpenVidu 로컬 배포도 LiveKit 호환 API를 7880에 연다).
# 운영은 OPENVIDU_* 환경변수로 주입. rtc.provider=openvidu일 때만 실제 사용된다.
openvidu:
  url: ${OPENVIDU_URL:ws://localhost:7880}
  api-key: ${OPENVIDU_API_KEY:devkey}
  api-secret: ${OPENVIDU_API_SECRET:devsecret-local-only-0123456789abcdef}
  token-ttl: ${OPENVIDU_TOKEN_TTL:10m}

# JWT: dev default is overridable via env (JWT_SECRET). Do NOT ship the default secret.
# access 1시간 — 한 세션(로비→방→게임)이 30분을 쉽게 넘기는 서비스 특성상 30분은 짧다.
# 프론트가 만료 5분 전 선제 갱신을 돌리므로 이 값은 '갱신이 실패했을 때 버텨 주는 여유'에 가깝다.
# Refresh는 Redis에 있어 서버가 언제든 무효화할 수 있으므로 access를 늘려도 회수 가능성은 그대로다.
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}      # 1시간
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14일 (Redis auth:refresh:{userId} TTL과 동일)
  guest-expiration-ms: ${JWT_GUEST_EXPIRATION_MS:43200000}       # 12시간 — 게스트는 Refresh가 없어 갱신 불가(탭 종료 시 소멸)

# TURN/STUN 자격 발급(-31). secret은 EC2 coturn의 static-auth-secret과 동일 값이어야 한다.
# secret 미설정 시 STUN-only 응답(coturn 없는 로컬 개발용 degrade).
turn:
  host: ${TURN_HOST:i15a706.p.ssafy.io}
  port: ${TURN_PORT:3478}
  secret: ${TURN_SECRET:}
  credential-ttl-seconds: ${TURN_CREDENTIAL_TTL:600}

# S3 스토리지. endpoint 미설정 시 실제 AWS로 붙는다(설정 시 MinIO 등 S3 호환 서버).
# public-base-url은 조립하지 않고 그대로 쓴다 — path-style ↔ virtual-hosted 주소 방식이 달라
# 코드에서 문자열로 만들면 로컬(MinIO)과 운영(AWS)에서 다르게 깨진다.
# bucket/public-base-url 에 기본값(빈 값)을 두는 이유 — 미설정 시 '업로드 기능만' 비활성으로
# degrade 시키기 위해서다. 기본값이 없으면 CI 변수를 등록하기 전에 배포가 나가는 순간
# 플레이스홀더 해석 실패로 앱 전체가 기동하지 못한다(LIVEKIT_*·TURN_SECRET 과 같은 정책).
# 대신 미설정 상태로 업로드를 호출하면 STORAGE_UNAVAILABLE 로 명확히 실패한다.
storage:
  bucket: ${S3_BUCKET:}
  region: ${S3_REGION:ap-northeast-2}
  endpoint: ${S3_ENDPOINT:}
  path-style: ${S3_PATH_STYLE:false}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  public-base-url: ${S3_PUBLIC_BASE_URL:}
  presign-ttl: ${S3_PRESIGN_TTL:3m}

app:
  # Frontend dev origin(s) for CORS (Vite default 5173)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 회원가입 이메일 인증 정책 (API 명세서 v0.2.1)
  email-verification:
    code-ttl: 5m           # 인증번호 유효시간
    token-ttl: 5m          # 인증 완료 토큰(verificationToken) 유효시간
    resend-cooldown: 60s   # 재발송 최소 간격
    daily-send-limit: 5    # 이메일당 1일 발송 상한
    max-verify-attempts: 5 # 코드 검증 시도 상한(초과 시 코드 폐기)
    from: ${MAIL_FROM:no-reply@mottok.local}

  # 소셜 로그인 OAuth (API 명세서 POST /auth/social/{provider}).
  # client-id가 비어 있으면 해당 provider 호출은 401(SOCIAL_LOGIN_FAILED)로 실패한다.
  # 발급처 — Google: Google Cloud Console OAuth 2.0 클라이언트 / Kakao: Kakao Developers 앱의 REST API 키.
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}       # 카카오 REST API 키
      client-secret: ${KAKAO_CLIENT_SECRET:} # 콘솔에서 사용 설정 시에만(선택)

  # 그림으로 말해요(게임 10) AI 채점 — GMS 릴레이(OpenAI 호환 chat/completions).
  # 프론트에 키를 두면 번들에 노출되므로 채점은 서버에서만 호출한다.
  # api-key/model 미설정 시 채점 요청은 GAME_JUDGE_UNAVAILABLE로 실패한다(조용한 대체 없음).
  gms:
    api-url: ${GMS_API_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
    api-key: ${GMS_API_KEY:}
    model: ${GMS_MODEL:gpt-5-mini}

  # 회원 탈퇴 정책 (API 명세서 DELETE /users/me, -111)
  withdrawal:
    rejoin-cooldown: 7d   # 탈퇴 후 같은 이메일·소셜 계정으로 다시 가입할 수 있게 되기까지

  # 비밀번호 재설정 (API 명세서 POST /auth/password/*)
  password-reset:
    token-ttl: 30m   # 재설정 토큰 유효시간(Redis auth:pwreset:{token})
    link-base-url: ${PW_RESET_LINK_BASE:http://localhost:5173/auth/reset-password}

  # GPU 워커 폴링 API(/api/internal/ai-jobs/**, -102) 공유 시크릿.
  # SecurityConfig는 이 경로를 permitAll로 열어 두고, InternalApiKeyFilter가
  # X-Internal-Key 헤더를 이 값과 비교하는 것이 실제 방어선이다. 미설정 시 전부 401로 막힌다.
  internal:
    api-key: ${INTERNAL_API_KEY:}
