# MotionTok CI/CD
# Runner: 앱 EC2(고사양)에 shell executor 로 등록되어 있어야 함.
#   등록 후 이 job 의 tags 를 해당 Runner 태그로 맞출 것.
stages:
  - deploy

# 프론트 빌드가 docker(root) 로 만든 산출물(node_modules/.pnpm-store/dist/tsbuildinfo 등)을
# git clean(gitlab-runner 권한)이 못 지워 "Permission denied" 로 job 이 실패했다.
# 이 산출물은 전부 .gitignore 에 등록돼 있는데, 기본 -ffdx 의 'x' 가 "무시된 파일까지 지워라"라
# 문제가 됐다. 'x' 를 빼면(-ffd) git 은 무시된 생성물을 손대지 않는다 → 권한 문제 원천 차단.
# 개별 -e 나열이 불필요하고 앞으로 생길 산출물도 자동으로 안전. (빌드가 매번 재생성하므로 스테일 걱정 없음)
variables:
  GIT_CLEAN_FLAGS: -ffd

deploy-backend:
  stage: deploy
  tags:
    - a706-motok-runner
  rules:
    # main 브랜치 & 백엔드(또는 CI 설정) 변경 시 배포
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - MotionTok/Backend/**/*
        - .gitlab-ci.yml        # CI 설정만 바꿔도 재배포되게
  script:
    - cd MotionTok/Backend
    # ── CI/CD Variables → .env 생성 (비밀값은 GitLab Settings>CI/CD>Variables 에 등록) ──
    #    DB_HOST=mysql / REDIS_HOST=redis : 같은 compose 네트워크의 컨테이너 이름 (고정)
    #    MYSQL_ROOT_PASSWORD : mysql 컨테이너 root 비밀번호 (초기화/헬스체크용)
    - |
      # 필수 값 (없으면 앱이 안 뜸). DB_HOST=mysql / REDIS_HOST=redis 는 운영 고정.
      cat > .env <<EOF
      DB_HOST=mysql
      DB_PORT=3306
      DB_NAME=$DB_NAME
      DB_USERNAME=$DB_USERNAME
      DB_PASSWORD=$DB_PASSWORD
      MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      REDIS_HOST=redis
      REDIS_PORT=6379
      JWT_SECRET=$JWT_SECRET
      EOF
      # 선택 값: CI 변수가 설정된 경우에만 추가. 비어 있으면 줄을 안 넣어
      # application.yaml 의 기본값(${VAR:default})이 그대로 살아있게 한다.
      # (빈 문자열을 넣으면 Spring 이 기본값 대신 빈 값을 써서 기동 실패함)
      add() { [ -n "$2" ] && echo "$1=$2" >> .env; return 0; }
      add CORS_ALLOWED_ORIGINS "$CORS_ALLOWED_ORIGINS"
      add JWT_ACCESS_EXPIRATION_MS "$JWT_ACCESS_EXPIRATION_MS"
      add JWT_REFRESH_EXPIRATION_MS "$JWT_REFRESH_EXPIRATION_MS"
      add MAIL_HOST "$MAIL_HOST"
      add MAIL_PORT "$MAIL_PORT"
      add MAIL_USERNAME "$MAIL_USERNAME"
      add MAIL_PASSWORD "$MAIL_PASSWORD"
      add MAIL_FROM "$MAIL_FROM"
      # 종합 /actuator/health 에 SMTP 접속 확인을 포함할지(기본 false). 켜면 메일 서버가 막혀
      # 있을 때 종합 health 가 503 이 되고 호출마다 5초씩 매달린다 — DB·Redis 상태를 가린다.
      # 컨테이너 healthcheck 는 liveness 를 보므로 어느 쪽이든 재시작에는 영향이 없다.
      add MAIL_HEALTH_ENABLED "$MAIL_HEALTH_ENABLED"
      # 비밀번호 재설정 메일 링크 — 운영에선 반드시 실제 도메인으로! (기본값이 localhost 라 안 넣으면 메일 링크가 깨짐)
      add PW_RESET_LINK_BASE "$PW_RESET_LINK_BASE"
      # 소셜 로그인 쓸 때만 (안 쓰면 비워둬도 됨)
      add GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
      add GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
      add KAKAO_CLIENT_ID "$KAKAO_CLIENT_ID"
      add KAKAO_CLIENT_SECRET "$KAKAO_CLIENT_SECRET"
      # 화상(SFU) — Spring 토큰 서명과 livekit 컨테이너(LIVEKIT_KEYS)가 같은 .env 를 공유.
      # 미등록 시 화상만 비활성(앱 기동엔 영향 없음). URL 은 wss://motok.co.kr/livekit
      add LIVEKIT_URL "$LIVEKIT_URL"
      add LIVEKIT_API_KEY "$LIVEKIT_API_KEY"
      add LIVEKIT_API_SECRET "$LIVEKIT_API_SECRET"
      # 파일 업로드(S3) — 미등록 시 업로드 기능만 비활성(앱 기동엔 영향 없음).
      # S3_ENDPOINT / S3_PATH_STYLE 은 일부러 등록하지 않는다: 비어 있으면 실제 AWS 로 붙고,
      # 값이 있으면 MinIO 등 호환 서버로 붙는다(로컬 전용). add 가 빈 값이면 줄을 안 넣으므로
      # 등록하지 않는 것만으로 운영이 자동으로 AWS 모드가 된다.
      # S3_REGION 도 application.yaml 기본값이 ap-northeast-2 라 버킷이 그 리전이면 불필요.
      add S3_BUCKET "$S3_BUCKET"
      add S3_REGION "$S3_REGION"
      add S3_ACCESS_KEY "$S3_ACCESS_KEY"
      add S3_SECRET_KEY "$S3_SECRET_KEY"
      add S3_PUBLIC_BASE_URL "$S3_PUBLIC_BASE_URL"
      # 그림으로 말해요 AI 채점(GMS) — 미등록 시 채점만 실패(앱 기동엔 영향 없음).
      # API_URL 은 SSAFY GMS 릴레이로 고정이라 application.yaml 기본값을 쓴다.
      add GMS_API_KEY "$GMS_API_KEY"
      add GMS_MODEL "$GMS_MODEL"
      # GPU 워커 폴링 API(/api/internal/ai-jobs/**, -102) 공유 시크릿.
      # 미등록 시 InternalApiKeyFilter가 기본값(빈 문자열)으로 모든 요청을 401 처리한다(fail-safe).
      # 워커가 실제로 붙게 하려면 GitLab Settings>CI/CD>Variables 에 반드시 등록할 것.
      add INTERNAL_API_KEY "$INTERNAL_API_KEY"
      # 오픈 이벤트 기간 AI 아이템 생성 무료 제공 스위치. 미등록/빈 값이면 application.yaml
      # 기본값(false, 유료)이 유지된다. 켜려면 GitLab Settings>CI/CD>Variables 에
      # AI_ITEM_FREE_EVENT=true 등록, 끄려면 그 값을 지우거나 false로 바꾸고 재배포.
      add AI_ITEM_FREE_EVENT "$AI_ITEM_FREE_EVENT"
      # AI 아이템 생성을 어디서 돌릴지: GPU(기본) / FAL / AUTO.
      #   GPU  — GPU 워커만. 워커가 없으면 타임아웃 후 자동 환불된다.
      #   FAL  — fal만. 워커 폴링 창구(/internal/ai-jobs/next)가 204로 닫혀 워커는 못 가져간다.
      #   AUTO — GPU 우선. 아무도 안 가져간 채 FAL_HANDOVER_SECONDS가 지난 job만 fal이 넘겨받는다.
      # 미등록이면 application.yaml 기본값(GPU)이라 지금 동작 그대로다.
      add AI_PROVIDER "$AI_PROVIDER"
      # fal 크레딧 키. 프론트에는 절대 넣지 않는다(번들에 노출되면 남이 우리 크레딧을 쓴다).
      # 미등록이면 AI_PROVIDER가 FAL/AUTO여도 fal 경로가 켜지지 않는다(FalImageClient.available()=false).
      add FAL_KEY "$FAL_KEY"
      # 모델·호스트는 application.yaml 기본값(fal-ai/qwen-image-edit-2511/lora, https://fal.run)을 쓴다.
      # 모델을 바꾸거나 큐 호스트로 옮길 때만 등록한다.
      # LoRA를 쓰는 동안에는 /lora 로 끝나는 엔드포인트여야 한다(기본 쪽에는 loras 필드가 없다).
      add FAL_MODEL "$FAL_MODEL"
      add FAL_BASE_URL "$FAL_BASE_URL"
      # LoRA 세트 — 세 값은 함께 켜고 함께 끈다. 워커와 같은 Lightning LoRA를 얹어야 "다시 생성"이
      # 원본에서 멀어지지 않는다. FAL_LORA_PATH를 빈 값으로 두면 스텝·guidance도 보내지 않고
      # fal 기본값(28 / 4.5)으로 돈다 — 4스텝 전용 LoRA에 28스텝을 시키는 반쪽 설정을 막는다.
      # 미등록이면 yaml 기본값(4스텝 / guidance 1.0 / scale 1.0)이라 워커와 같은 조건이다.
      add FAL_LORA_PATH "$FAL_LORA_PATH"
      add FAL_LORA_SCALE "$FAL_LORA_SCALE"
      add FAL_STEPS "$FAL_STEPS"
      add FAL_GUIDANCE_SCALE "$FAL_GUIDANCE_SCALE"
      # 흰 배경 제거 임계값(0~255, 기본 240). 배경이 남으면 내리고, 그림의 밝은 부분이 파먹히면 올린다.
      add FAL_BACKGROUND_THRESHOLD "$FAL_BACKGROUND_THRESHOLD"
      # AUTO에서 GPU에게 먼저 주는 시간(초). 프론트가 60초에 포기하므로
      # (이 대기 + fal 생성 10~20초)가 그 안에 들어와야 한다. 기본 20.
      # 생성 지시문 — 결과 품질을 좌우한다. 재빌드 없이 CI 변수만 바꿔 재배포하면 반영된다.
      # {category}는 아이템 분류(sticker·face mask 등)로 치환된다. 미등록이면 yaml 기본 프롬프트.
      add FAL_PROMPT "$FAL_PROMPT"
      add FAL_NEGATIVE_PROMPT "$FAL_NEGATIVE_PROMPT"
      add FAL_HANDOVER_SECONDS "$FAL_HANDOVER_SECONDS"
      # 하루 fal 호출 상한(0이면 무제한). GPU가 조용히 죽으면 전량 fal로 흘러
      # 크레딧이 하루에 소진될 수 있다 — 안전핀이라 등록을 권한다. 기본 120.
      add FAL_DAILY_LIMIT "$FAL_DAILY_LIMIT"
    # ── 빌드 + 실행 (변경분만 재빌드) ──
    - docker compose -f docker-compose.prod.yml up -d --build
    # 재생성된 컨테이너(livekit 등)의 새 IP 를 nginx 가 다시 해석하도록 reload (무중단)
    - docker exec motiontok-nginx nginx -s reload || true
    # ── 오래된 dangling 이미지 정리 ──
    - docker image prune -f

deploy-frontend:
  stage: deploy
  tags:
    - a706-motok-runner      # deploy-backend 와 동일한 Runner
  rules:
    # main 브랜치 & 프론트엔드(또는 CI 설정) 변경 시 배포
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - MotionTok/Frontend/**/*
        - .gitlab-ci.yml        # CI 설정만 바꿔도 재배포되게
  script:
    - cd MotionTok/Frontend
    # ── Node 컨테이너에서 빌드 (호스트에 node/pnpm 불필요) ──
    #    VITE_* 는 빌드 시점에 코드에 박힘. GitLab Variables 값을 -e 로 컨테이너에 넘겨야 vite 가 읽음.
    #    (Variables 에만 등록하고 -e 를 안 넘기면 빌드에 반영 안 됨)
    #    VITE_API_BASE_URL=/api : 같은 도메인 상대경로 → CORS 없음.
    #    VITE_GOOGLE_CLIENT_ID / VITE_KAKAO_REST_KEY : authorize URL 노출용 공개값(소셜 로그인).
    - |
      docker run --rm \
        -v "$PWD":/app -w /app \
        -e VITE_API_BASE_URL=/api \
        -e VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
        -e VITE_KAKAO_REST_KEY="$VITE_KAKAO_REST_KEY" \
        node:22-alpine \
        sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build"
    # ── 빌드 결과(dist)를 nginx 서빙 폴더에 덮어쓴다 (nginx bind mount 라 재시작 불필요) ──
    #    지우지 않고 덮어쓰는 이유 — Vite 청크는 해시 파일명이라 배포마다 이름이 바뀐다.
    #    통째로 지우면 배포 전부터 열려 있던 탭이 아는 청크가 서버에서 사라지고,
    #    그 탭은 지연 로딩되는 화면(상점·게임)에 들어가는 순간 404가 난다.
    #    화면에는 아무 일도 일어나지 않고 콘솔에만 남아서
    #    "게임 시작을 눌렀는데 카메라만 보인다"로 나타난다.
    #    새 파일과 옛 파일은 이름이 달라 충돌하지 않으므로 그냥 같이 두면 된다.
    - mkdir -p /srv/motok/frontend
    - cp -r dist/. /srv/motok/frontend/
    #    옛 청크를 영원히 쌓아 둘 수는 없으니 오래된 것만 정리한다. cp 가 이번 배포에 포함된 파일의
    #    mtime 을 갱신하므로, 7일 넘게 어느 배포에도 없었던 파일만 지워진다.
    #    (열어 둔 탭의 현실적인 수명보다 넉넉하게 잡은 값)
    - find /srv/motok/frontend/assets -type f -mtime +7 -delete || true
