spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:motiontok}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 메일 발송. MAIL_HOST 미설정 시 JavaMailSender 빈이 만들어지지 않고,
  # 인증번호는 발송 대신 로그로 출력된다(로컬 개발용). 운영에서는 반드시 설정할 것.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# JWT: dev default is overridable via env (JWT_SECRET). Do NOT ship the default secret.
jwt:
  secret: ${JWT_SECRET:motiontok-local-dev-secret-change-me-to-a-long-random-value-at-least-64-bytes-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}      # 30분
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14일 (Redis auth:refresh:{userId} TTL과 동일)

app:
  # Frontend dev origin(s) for CORS (Vite default 5173)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 회원가입 이메일 인증 정책 (API 명세서 v0.2.1)
  email-verification:
    code-ttl: 5m           # 인증번호 유효시간
    token-ttl: 5m          # 인증 완료 토큰(verificationToken) 유효시간
    resend-cooldown: 60s   # 재발송 최소 간격
    daily-send-limit: 5    # 이메일당 1일 발송 상한
    max-verify-attempts: 5 # 코드 검증 시도 상한(초과 시 코드 폐기)
    from: ${MAIL_FROM:no-reply@mottok.local}
