<!--
  흑백 효과 아이템의 상점·인벤토리 썸네일.

  영상 위에 얹히지 않는다 — 효과는 CSS filter로 프레임 전체에 걸리고, 이 파일은 목록에서
  무엇인지 알아보게 하는 아이콘일 뿐이다(뽀샤시 아이콘과 같은 규칙).

  얼굴 반쪽만 색을 빼서 "색이 사라지는 효과"임을 한 장으로 보여 준다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="흑백 효과">
  <defs>
    <!-- 오른쪽 절반만 회색으로 — 경계를 세로로 잘라 대비를 만든다 -->
    <clipPath id="leftHalf"><rect x="0" y="0" width="32" height="64" /></clipPath>
    <clipPath id="rightHalf"><rect x="32" y="0" width="32" height="64" /></clipPath>
  </defs>

  <!-- 색 있는 왼쪽 -->
  <g clip-path="url(#leftHalf)">
    <circle cx="32" cy="31" r="19" fill="#ffd9b0" />
    <circle cx="32" cy="31" r="19" fill="none" stroke="#8a6a4f" stroke-width="2.4" />
    <circle cx="25" cy="28" r="2" fill="#5a4636" />
    <path d="M25 38c3 2.4 11 2.4 14 0" fill="none" stroke="#c9705f" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- 색 빠진 오른쪽 -->
  <g clip-path="url(#rightHalf)">
    <circle cx="32" cy="31" r="19" fill="#d8d8d8" />
    <circle cx="32" cy="31" r="19" fill="none" stroke="#4a4a4a" stroke-width="2.4" />
    <circle cx="39" cy="28" r="2" fill="#3a3a3a" />
    <path d="M25 38c3 2.4 11 2.4 14 0" fill="none" stroke="#6e6e6e" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- 가운데 경계선 -->
  <line x1="32" y1="9" x2="32" y2="53" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="3 2.5" />
</svg>
