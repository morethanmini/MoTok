# ── 응답 압축 ─────────────────────────────────────────────────────────
#
# 왜 별도 파일인가 — gzip 지시자는 http 컨텍스트에 있어야 server 블록 전체에 적용된다.
# nginx:alpine 의 기본 /etc/nginx/nginx.conf 는 `#gzip on;` 으로 주석 처리돼 있는데,
# compose 는 conf.d 디렉터리만 마운트하므로(nginx.conf 는 이미지 기본값 그대로)
# 그 파일을 고칠 수 없다. conf.d/*.conf 가 http 컨텍스트에 include 되는 성질을 이용한다.
#
# 압축이 없으면 JS 번들·CSS가 원본 크기로 전송된다. 텍스트 자산은 보통 3~4배 줄어든다.

gzip on;

# 6 이상은 CPU 를 눈에 띄게 더 쓰면서 크기는 거의 줄지 않는다.
# 이 서버는 t2.xlarge(버스터블)라서 CPU 크레딧을 아끼는 편이 낫다.
gzip_comp_level 5;

# 1KB 미만은 압축해도 헤더 오버헤드에 묻힌다.
gzip_min_length 1024;

# Via 헤더를 달고 오는(중간 프록시를 거친) 요청에도 압축한다. 기본값 off 는 그 경우를 건너뛴다.
gzip_proxied any;

# Vary: Accept-Encoding — 중간 캐시가 압축본을 비압축 클라이언트에 주는 사고를 막는다. 필수.
gzip_vary on;

# text/html 은 항상 포함되므로 적지 않는다(적으면 duplicate MIME type 경고가 난다).
#
# 빠져 있는 것들과 그 이유
#  - woff2·png·jpg·webp: 이미 압축된 포맷이라 gzip 이 오히려 크기를 늘린다.
#  - /mediapipe/(55MB): 압축 CPU 가 크다. expires 30d 로 재수신을 없앴으니 압축할 이유가 없다.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
