# MotionTok 운영용 nginx.conf (-153)
#
# 지금까지는 이 파일이 없어 이미지 기본값을 그대로 썼다. 그 기본값의 worker_connections 가
# 1024 라, 프록시가 커넥션 슬롯을 2개(클라 + 업스트림) 쓰는 것을 감안하면
# 4 vCPU × 1024 ÷ 2 ≒ 동시 WebSocket 2,000명이 하드 상한이었다 — 베타 목표와 같은 수치라
# 여유가 0이다. 여기서 올린다.
#
# ⚠ events 블록은 반드시 이 파일(main 컨텍스트)에 있어야 한다.
#   conf.d/*.conf 는 http 컨텍스트 안으로 include 되므로 거기에 넣으면
#   "events directive is not allowed here" 로 nginx 가 기동조차 못 한다.

user  nginx;
worker_processes  auto;          # = vCPU 수 (t2.xlarge 이므로 4)

# 슬롯을 올려도 파일 디스크립터에 막히면 의미가 없다.
# 실측 결과 컨테이너 기본값이 soft 1024 였다 — compose 의 ulimits 와 함께 올린다.
worker_rlimit_nofile 65535;

# ⚠ /var/log/nginx/error.log 가 아니라 /dev/stderr 다.
#   그 경로는 이미지에서 /dev/stderr 로 가는 심볼릭 링크인데, compose 가 그 디렉터리에
#   호스트 볼륨을 마운트하면 링크가 가려져 docker logs 가 빈다.
#   하필 기동 실패([emerg])와 upstream 오류가 거기로 나오므로, 크래시 루프일 때
#   원인을 볼 수단이 통째로 사라진다. 명시해서 마운트와 무관하게 만든다.
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    # ⚠ multi_accept 는 일부러 켜지 않았다(기본 off).
    #   한 워커가 대기 중인 연결을 한 번에 모두 받아 가는 옵션이라, 워커 간 부하가 한쪽으로
    #   쏠릴 수 있다. 이득은 불확실하고 부작용은 실측해 본 적이 없다 —
    #   "되던 게 안 되는 일은 없어야 한다"가 이번 원칙이라 검증 안 된 튜닝은 넣지 않는다.
    #   필요하면 /nginx_status 의 accepts/handled 와 워커별 CPU 를 보고 나중에 켠다.
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 기본 액세스 로그 형식(이미지 기본과 동일) ──
    # 실제로 쓰는 JSON 형식은 conf.d/motok.conf 에서 정의·적용한다.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ⚠ gzip 설정을 여기에 두지 않는다. conf.d/gzip.conf 가 이미 갖고 있고,
    #   conf.d/*.conf 는 아래 include 로 <b>같은 http 컨텍스트</b>에 들어온다.
    #   양쪽에 쓰면 nginx 는 경고가 아니라 [emerg] "gzip" directive is duplicate 로
    #   기동 자체를 거부한다 — 80/443 이 통째로 죽는다.
    #   (한 번 실제로 밟았다: nginx.conf 만 단독으로 nginx -t 하면 통과해서 안 보인다.
    #    검증은 반드시 nginx.conf + conf.d 를 함께 마운트한 상태로 해야 한다.)
    #
    #   wasm 을 gzip_types 에 넣지 않은 것도 의도다. gzip.conf 주석 참고 —
    #   10.6MB wasm 을 comp_level 5 로 실시간 압축하면 요청당 CPU 가 크고,
    #   t2 버스터블은 CPU 크레딧이 마르면 성능이 하드하게 잘린다.
    #   expires 30d 로 재방문 재수신을 이미 없앴으므로 압축 이득보다 손해가 크다.
    #   (T+0 첫 다운로드까지 줄이려면 미리 .gz 를 만들어 두는 gzip_static 이 정답이고,
    #    그건 프론트 배포 파이프라인 변경이 필요해 베타 이후 백로그로 뺐다.)

    include /etc/nginx/conf.d/*.conf;   # ★ 이 줄이 있어야 motok.conf·gzip.conf 가 로드된다
}
