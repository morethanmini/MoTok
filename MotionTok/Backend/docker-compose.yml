services:
  mysql:
    image: mysql:8.4
    container_name: motiontok-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-motiontok}
      MYSQL_USER: ${DB_USERNAME:-ssafy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ssafy}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트에 로컬 MySQL이 3306을 점유 중이라 3307로 매핑
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: motiontok-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # WebRTC SFU 미디어서버 (-30). 화상 개발 시에만 필요 — 안 쓰면 안 떠 있어도 무방.
  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: motiontok-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"        # ws 시그널링/API
      - "7881:7881"        # TCP 폴백
      - "7882:7882/udp"    # RTC 미디어 (로컬은 단일 포트 멀티플렉스)

volumes:
  mysql-data:
  redis-data:
