<!--
  뽀샤시 효과 아이템의 상점·인벤토리 썸네일.

  이 그림은 영상 위에 얹히지 않는다 — 효과는 CSS로 프레임 전체에 걸리고, 이 파일은 목록에서
  무엇인지 알아보게 하는 아이콘일 뿐이다. 그래서 스티커처럼 픽셀아트 PNG가 아니라 SVG다
  (어느 크기에서도 또렷하고, 파일도 한 장으로 끝난다).

  안쪽의 선명한 얼굴과 바깥으로 번지는 빛으로 "부드럽게 빛나는" 느낌만 전한다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="뽀샤시 효과">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fff6de" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffe7a8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffd9c9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 번지는 빛 -->
  <circle cx="32" cy="30" r="30" fill="url(#glow)" />

  <!-- 얼굴 — 빛 속에서도 윤곽은 살아 있다는 게 이 효과의 요점이다 -->
  <g fill="none" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round">
    <circle cx="32" cy="31" r="14" fill="#fff3e2" />
    <path d="M26 29h.01M38 29h.01" stroke-width="3.4" />
    <path d="M27.5 37c2.8 2.2 6.2 2.2 9 0" />
  </g>

  <!-- 반짝임 4개 — 상점 카드에서 '효과'임을 한눈에 -->
  <g fill="#ffcf5f" stroke="#b4813a" stroke-width="1.1">
    <path d="M52 12l1.7 3.6L57.3 17l-3.6 1.7L52 22l-1.7-3.3L46.7 17l3.6-1.4z" />
    <path d="M11 18l1.2 2.6 2.6 1.2-2.6 1.2L11 26l-1.2-2.4L7.2 22l2.6-1.4z" />
    <path d="M54 44l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" />
    <path d="M10 45l1 2.2 2.2 1-2.2 1L10 51.4l-1-2.2-2.2-1 2.2-1z" />
  </g>
</svg>
