spring:
  # 로컬 개발용 .env 로드
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:Backend/.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 메일 발송. MAIL_HOST 미설정 시 JavaMailSender 빈이 만들어지지 않고,
  # 인증번호는 발송 대신 로그로 출력된다(로컬 개발용). 운영에서는 반드시 설정할 것.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000  # SMTP 연결 5초 타임아웃(포트 막힌 네트워크에서 무한 대기 방지)
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  tomcat:
    mbeanregistry:
      # 켜야 tomcat_threads_busy / _config_max 지표가 나온다 (-153).
      # 기본값이 false 라 그대로 두면 "스레드가 몇 개 차올랐나"를 볼 수 없는데,
      # 그게 이번 베타에서 커넥션 풀 다음으로 중요한 포화 신호다.
      # 비용은 기동 시 MBean 등록뿐이고 요청 경로에는 관여하지 않는다.
      enabled: true
    # ★ nginx 의 upstream keepalive 와 짝을 이루는 값이다(-153).
    #   nginx 는 app 으로 가는 커넥션을 재사용하려고 열어 두는데, <b>톰캣이 먼저 끊으면</b>
    #   nginx 가 이미 닫힌 커넥션에 요청을 실어 보내 502 가 산발적으로 뜬다.
    #   톰캣 기본값은 connectionTimeout(20초)을 따라가 nginx(upstream keepalive_timeout 30초)보다
    #   짧다 — 그대로 두면 재현이 안 되는 간헐 502 가 된다.
    #   톰캣을 확실히 더 길게 잡아 <b>항상 nginx 가 먼저 닫도록</b> 순서를 고정한다.
    keep-alive-timeout: 120s

# ── 관측(-153) ────────────────────────────────────────────────
# 베타(2000명·1회성)에서 "언제 무엇이 포화됐나"를 재기 위한 지표 노출.
#
# 부하를 최소화한 선택 세 가지 — 관측이 부하가 되면 측정값 자체가 오염된다.
#  1. 노출 엔드포인트를 health·prometheus 로만 제한한다. heapdump·env 는 절대 열지 않는다
#     (heapdump 는 호출 한 번으로 힙 전체를 덤프해 서버를 멈추고, env 는 시크릿을 통째로 뱉는다).
#  2. 히스토그램(percentiles-histogram) 대신 클라이언트 사이드 percentiles 를 쓴다.
#     히스토그램은 URI 조합마다 수백 개 버킷을 만들어 메모리를 크게 먹는데,
#     우리는 인스턴스가 하나라 앱 안에서 계산한 분위수로 충분하다(집계 합산이 필요 없다).
#  3. 스크레이프는 밖(노트북)에서 한다. 서버는 값을 들고만 있고 저장·질의는 하지 않는다.
management:
  server:
    # ★ 8080 과 분리한다. 톰캣 스레드가 전부 잠기면 같은 포트의 actuator 도 응답하지 못해
    #   "죽는 순간의 지표"를 잃는다 — 그 순간이 우리가 가장 알고 싶은 때다.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    mail:
      # ★ 메일은 종합 health 에서 뺀다.
      #
      # 이유는 compose healthcheck 가 종합이 아니라 liveness 를 보는 것과 같다 — SMTP 가 막혀
      # 있다고 "앱이 이상하다"가 아니다. 그런데 종합 health 는 하나라도 DOWN 이면 503 이라,
      # 정작 장애를 진단하려고 /actuator/health 를 열었을 때 <b>메일 때문에 빨간불</b>이 떠
      # DB·Redis 가 멀쩡한지를 가리게 된다.
      #
      # 게다가 이 지표는 SMTP 에 실제로 접속해 본다(connectiontimeout 5초). 종합 health 를
      # 부를 때마다 5초가 매달리고 스택트레이스가 쌓이는데, 그게 하필 진단이 급한 순간이다.
      # SSAFY 교육망처럼 smtp 호스트가 막힌 곳에서는 늘 그렇게 된다.
      #
      # 메일이 실제로 안 나가는 건 보내는 경로에서 드러난다(VerificationMailSender·
      # PasswordResetMailSender 로그). 운영에서 그 신호를 health 로도 보고 싶으면 CI 변수로 켠다.
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoint:
    health:
      # 이 포트는 외부에 열지 않는다(SSH 터널로만 접근). DB·Redis 상태까지 보이는 편이 진단에 낫다.
      show-details: always
      probes:
        # /actuator/health/liveness 와 /readiness 를 만든다.
        # compose 의 healthcheck 가 liveness 를 보기 때문에 <b>반드시</b> 있어야 한다 —
        # 없으면 그 경로가 404 라서 컨테이너가 앱이 멀쩡한데도 영원히 unhealthy 가 된다.
        # (기본값은 쿠버네티스 등에서 감지될 때만 켜진다. 여기선 명시해서 환경에 의존하지 않게 한다)
        #
        # 왜 종합(/actuator/health)이 아니라 liveness 인가 —
        #   종합은 DB·Redis·메일 등 <b>모든</b> 의존성을 합산해서 하나라도 DOWN 이면 503 이다.
        #   메일 서버가 잠깐 흔들려도 503 이 되는데, 그건 "앱을 재시작해야 한다"와 전혀 다른 상태다.
        #   liveness = "JVM 이 살아 있고 스스로 회복 불가한 상태가 아니다" 뿐이라
        #   재시작으로 고쳐지는 문제에만 반응한다. 헬스체크가 걸어야 할 기준은 이쪽이다.
        enabled: true
  metrics:
    tags:
      application: motiontok
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

# Swagger(springdoc) — 기본 잠금. 운영(CI/CD)에 API 문서가 노출되지 않도록 끄고,
# 로컬 개발에서만 SWAGGER_ENABLED=true로 켠다(SecurityConfig의 permitAll도 같은 플래그로 함께 열린다).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# RTC 접속 방식 전역 스위치 (-123): livekit | openvidu | mesh
# 통합 rtc-access 응답의 mode가 이 값으로 결정된다. 레거시 video-token은 항상 LiveKit 고정.
rtc:
  provider: ${RTC_PROVIDER:livekit}

# LiveKit(SFU) 접속 토큰 발급 (-30).
# api-key/api-secret은 로컬 LiveKit 컨테이너의 keys 설정과 반드시 일치해야 한다.
# 기본값은 로컬 개발 전용 — 운영은 LIVEKIT_* 환경변수로 주입(.env → CI).
livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:devsecret-local-only-0123456789abcdef}
  token-ttl: ${LIVEKIT_TOKEN_TTL:10m}

# OpenVidu(SFU) 접속 토큰 발급 (-123). 내부 엔진이 LiveKit라 설정 구성 동일 — URL·키만 별도.
# 기본값은 로컬 개발 전용(OpenVidu 로컬 배포도 LiveKit 호환 API를 7880에 연다).
# 운영은 OPENVIDU_* 환경변수로 주입. rtc.provider=openvidu일 때만 실제 사용된다.
openvidu:
  url: ${OPENVIDU_URL:ws://localhost:7880}
  api-key: ${OPENVIDU_API_KEY:devkey}
  api-secret: ${OPENVIDU_API_SECRET:devsecret-local-only-0123456789abcdef}
  token-ttl: ${OPENVIDU_TOKEN_TTL:10m}

# JWT: dev default is overridable via env (JWT_SECRET). Do NOT ship the default secret.
# access 30분 — 한 세션(로비→방→게임)이 30분을 쉽게 넘기지만, 프론트가 만료 5분 전에 선제 갱신을 돌리고
# 그 타이머는 REST 요청과 무관하게 도므로(refreshScheduler) 게임 중에 토큰이 죽지 않는다.
# 로그아웃·다른 기기 로그인(단일 세션)은 세션 폐기 목록(auth:revoked-sid:{sid})으로 access까지 즉시
# 죽인다(v0.2.25). 그래도 이 값을 짧게 유지하는 이유 — 폐기 목록의 TTL이 이 값에 묶여 있고(길수록
# Redis에 흔적이 오래 남는다), 비밀번호 변경 등 아직 목록을 안 타는 경로와 Redis 장애(fail-open) 시에는
# 여전히 이 값이 '회수할 수 없는 창'이기 때문이다.
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}      # 30분
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14일 (Redis auth:refresh:{userId} TTL과 동일)
  guest-expiration-ms: ${JWT_GUEST_EXPIRATION_MS:1800000}        # 30분 — 게스트는 Refresh가 없어 갱신 불가(만료되면 재시작·로그인 유도)

# TURN/STUN 자격 발급(-31). secret은 EC2 coturn의 static-auth-secret과 동일 값이어야 한다.
# secret 미설정 시 STUN-only 응답(coturn 없는 로컬 개발용 degrade).
turn:
  host: ${TURN_HOST:i15a706.p.ssafy.io}
  port: ${TURN_PORT:3478}
  secret: ${TURN_SECRET:}
  credential-ttl-seconds: ${TURN_CREDENTIAL_TTL:600}

# S3 스토리지. endpoint 미설정 시 실제 AWS로 붙는다(설정 시 MinIO 등 S3 호환 서버).
# public-base-url은 조립하지 않고 그대로 쓴다 — path-style ↔ virtual-hosted 주소 방식이 달라
# 코드에서 문자열로 만들면 로컬(MinIO)과 운영(AWS)에서 다르게 깨진다.
# bucket/public-base-url 에 기본값(빈 값)을 두는 이유 — 미설정 시 '업로드 기능만' 비활성으로
# degrade 시키기 위해서다. 기본값이 없으면 CI 변수를 등록하기 전에 배포가 나가는 순간
# 플레이스홀더 해석 실패로 앱 전체가 기동하지 못한다(LIVEKIT_*·TURN_SECRET 과 같은 정책).
# 대신 미설정 상태로 업로드를 호출하면 STORAGE_UNAVAILABLE 로 명확히 실패한다.
storage:
  bucket: ${S3_BUCKET:}
  region: ${S3_REGION:ap-northeast-2}
  endpoint: ${S3_ENDPOINT:}
  path-style: ${S3_PATH_STYLE:false}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  public-base-url: ${S3_PUBLIC_BASE_URL:}
  presign-ttl: ${S3_PRESIGN_TTL:3m}

app:
  # Frontend dev origin(s) for CORS (Vite default 5173)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 인증 엔드포인트 남용 방지. 여러 사람이 같은 공인 IP를 쓰는 망(학원·사내망)이 주 사용처라
  # IP 기준 한도는 "한 명"이 아니라 "한 강의실"을 기준으로 잡았다. 시연 등으로 더 필요하면 env로 올린다.
  rate-limit:
    login-fail-threshold: ${LOGIN_FAIL_THRESHOLD:5}   # 이 횟수부터 차단(1분→5분→15분으로 증가)
    login-fail-window: 30m                            # 실패 카운터 수명. 이 시간 조용하면 처음부터 다시 센다
    guest-per-minute: ${GUEST_PER_MINUTE:10}          # 게스트 시작 IP당 분당 — 같은 망에서 동시에 눌러도 통과할 정도
    guest-per-hour: ${GUEST_PER_HOUR:100}             # 게스트 시작 IP당 시간당 — 스크립트(분당 수천)와는 자릿수가 다르다

  # 회원가입 이메일 인증 정책 (API 명세서 v0.2.1)
  email-verification:
    code-ttl: 5m           # 인증번호 유효시간
    token-ttl: 5m          # 인증 완료 토큰(verificationToken) 유효시간
    resend-cooldown: 60s   # 재발송 최소 간격
    daily-send-limit: 5    # 이메일당 1일 발송 상한
    max-verify-attempts: 5 # 코드 검증 시도 상한(초과 시 코드 폐기)
    from: ${MAIL_FROM:no-reply@mottok.local}

  # 소셜 로그인 OAuth (API 명세서 POST /auth/social/{provider}).
  # client-id가 비어 있으면 해당 provider 호출은 401(SOCIAL_LOGIN_FAILED)로 실패한다.
  # 발급처 — Google: Google Cloud Console OAuth 2.0 클라이언트 / Kakao: Kakao Developers 앱의 REST API 키.
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}       # 카카오 REST API 키
      client-secret: ${KAKAO_CLIENT_SECRET:} # 콘솔에서 사용 설정 시에만(선택)

  # 그림으로 말해요(게임 10) AI 채점 — GMS 릴레이(OpenAI 호환 chat/completions).
  # 프론트에 키를 두면 번들에 노출되므로 채점은 서버에서만 호출한다.
  # api-key/model 미설정 시 채점 요청은 GAME_JUDGE_UNAVAILABLE로 실패한다(조용한 대체 없음).
  gms:
    api-url: ${GMS_API_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
    api-key: ${GMS_API_KEY:}
    model: ${GMS_MODEL:gpt-5-mini}

  # 회원 탈퇴 정책 (API 명세서 DELETE /users/me, -111)
  withdrawal:
    rejoin-cooldown: 7d   # 탈퇴 후 같은 이메일·소셜 계정으로 다시 가입할 수 있게 되기까지

  # 비밀번호 재설정 (API 명세서 POST /auth/password/*)
  password-reset:
    token-ttl: 30m   # 재설정 토큰 유효시간(Redis auth:pwreset:{token})
    link-base-url: ${PW_RESET_LINK_BASE:http://localhost:5173/auth/reset-password}

  # GPU 워커 폴링 API(/api/internal/ai-jobs/**, -102) 공유 시크릿.
  # SecurityConfig는 이 경로를 permitAll로 열어 두고, InternalApiKeyFilter가
  # X-Internal-Key 헤더를 이 값과 비교하는 것이 실제 방어선이다. 미설정 시 전부 401로 막힌다.
  internal:
    api-key: ${INTERNAL_API_KEY:}

  # AI 아이템 생성 1회 결제 비용(포인트). 이 금액으로 최초 생성 + 재생성 1회까지 가능하다.
  shop:
    ai-item-cost: ${AI_ITEM_COST:1500}
    # 오픈 이벤트 기간 동안 AI 아이템 생성 포인트 차감을 건너뛴다(검증/차감/PointHistory 기록 전부 스킵,
    # pointsCharged=0으로 저장). 재생성 횟수 제한(결제당 최대 2회)은 이 값과 무관하게 그대로 적용된다.
    ai-item-free-event: ${AI_ITEM_FREE_EVENT:false}
    # 워커가 응답 없이 죽어 PROCESSING에 갇힌 job을 AiItemJobTimeoutSweeper가 이 시간(분) 이상
    # 지나면 FAILED로 강제 정리하고 환불한다.
    ai-job-timeout-minutes: ${AI_JOB_TIMEOUT_MINUTES:5}

    # AI 아이템 생성을 어디서 돌릴지.
    #  GPU  — GPU 워커만(기존 동작). 워커가 없으면 타임아웃 후 환불된다.
    #  FAL  — fal만. 워커 폴링 창구(/internal/ai-jobs/next)를 닫아 워커가 살아 있어도 못 가져간다.
    #  AUTO — GPU 우선. 아무도 가져가지 않은 채 handover-seconds가 지난 job만 fal이 넘겨받는다.
    ai-provider: ${AI_PROVIDER:GPU}

    fal:
      # 동기 호출 호스트. 큐(https://queue.fal.run)는 요청 후 status/response 폴링이 필요한 2단계라,
      # 전용 스레드에서 기다리는 우리 구조에는 한 번에 끝나는 이쪽이 맞다.
      base-url: ${FAL_BASE_URL:https://fal.run}
      # /lora 붙은 쪽을 쓴다 — 입력 스키마는 기본 엔드포인트와 같고 loras·num_inference_steps·
      # guidance_scale만 더 받는다. 아래 lora-path를 쓰려면 이 주소여야 한다.
      model: ${FAL_MODEL:fal-ai/qwen-image-edit-2511/lora}
      # 프론트에 절대 넣지 않는다 — 번들에 노출되면 남이 우리 크레딧을 쓴다.
      api-key: ${FAL_KEY:}
      # 생성 지시문 — GPU 워커 노트북(ITEM_PROMPT)과 같은 문구를 기본값으로 둔다.
      # 두 경로의 결과가 달라 보이면 유저는 "어떤 날은 이상하게 나온다"로 받아들인다.
      # 재빌드 없이 바꿀 수 있게 설정으로 뺐다. {category}는 아이템 분류로 치환된다(현재 기본 문구는 안 씀).
      prompt: >-
        ${FAL_PROMPT:Convert this hand-drawn sketch into a pixel-style game item icon while strictly preserving the original
        drawing.
        Keep the exact silhouette, outline structure, proportions, facial feature placement, expression, and
        overall composition exactly as in the sketch.
        Do not redesign, reinterpret, beautify by changing the shape, or add/remove features.
        Only apply visual styling: pastel colors, thick dark navy outline, limited color palette, minimal
        shading, and subtle pixel/dot texture for a retro mini-game feel.
        The result must look like the user's original drawing itself turned into a game item, not a different
        character based on it.
        Single centered object, plain white background.
        If the sketch has no eyes, mouth, or face, do not add any.
        Inanimate shapes must stay inanimate objects.
        Single centered object, plain white background.}
      # GPU 워커도 negative_prompt를 사실상 끄고 쓴다(Lightning LoRA가 CFG 증류라 true_cfg_scale=1.0).
      # 아래에서 같은 LoRA를 얹고 guidance도 1로 끄므로 이쪽도 비워 두는 게 워커와 같은 조건이다.
      negative-prompt: ${FAL_NEGATIVE_PROMPT:}
      # ── LoRA 세트 ── 세 값은 함께 켜고 함께 끈다(FalProperties.usesLora 주석 참고).
      # 워커와 같은 Lightning LoRA를 얹는다. 이게 없으면 fal 기본값(28스텝 · guidance 4.5)으로 도는데,
      # 자유도가 커서 모델이 원본에서 멀어지고 "다시 생성"할 때마다 얼굴을 새로 그려 버린다.
      # lora-path를 비우면 steps·guidance-scale도 보내지 않고 fal 기본값에 맡긴다.
      lora-path: ${FAL_LORA_PATH:https://huggingface.co/lightx2v/Qwen-Image-Edit-2511-Lightning/resolve/main/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors}
      lora-scale: ${FAL_LORA_SCALE:1.0}
      # 위 LoRA는 파일명대로 4스텝 전용으로 증류돼 있다 — 28로 올리면 오히려 나빠진다.
      steps: ${FAL_STEPS:4}
      # 증류 LoRA는 CFG가 접혀 들어가 있어 끈다(워커의 true_cfg_scale=1.0과 같은 뜻).
      guidance-scale: ${FAL_GUIDANCE_SCALE:1.0}
      # 배경 제거 임계값(0~255) — R·G·B가 모두 이 값 이상이면 흰색으로 본다.
      # 낮출수록 과감히 지운다. 그림의 밝은 부분까지 파먹으면 올리고, 배경이 남으면 내린다.
      background-threshold: ${FAL_BACKGROUND_THRESHOLD:240}
      # AUTO에서 PENDING이 이 시간을 넘기면 fal이 넘겨받는다. 프론트는 60초에 포기하므로
      # (인계 대기 + fal 생성 10~20초)가 그 안에 들어와야 한다.
      handover-seconds: ${FAL_HANDOVER_SECONDS:20}
      # 하루 호출 상한(0이면 무제한). GPU가 조용히 죽으면 전량 fal로 흘러 크레딧이 하루에 소진될 수 있다.
      daily-limit: ${FAL_DAILY_LIMIT:120}
