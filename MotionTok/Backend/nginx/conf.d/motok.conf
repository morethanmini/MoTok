# 백엔드 앱 컨테이너 (compose 네트워크 내부 이름)
upstream backend {
    server app:8080;
    # 커넥션 재사용(-153, IN-04). 없으면 /api 요청마다 nginx→app 신규 TCP 를 맺고 즉시 닫아
    # TIME_WAIT 가 60초 쌓인다. 임시포트 28,232개 ÷ 60초 = 지속 470 conn/s 가 상한이 되고,
    # 넘으면 "Cannot assign requested address" 로 /api 가 전면 502 가 된다(자력 회복 불가).
    # 실측으로 확인한 포트 범위: 32768-60999.
    keepalive 128;
    keepalive_requests 10000;
    # ⚠ 톰캣보다 <b>짧아야</b> 한다. 백엔드가 먼저 끊으면 nginx 가 이미 닫힌 커넥션에 요청을
    #   실어 보내 간헐 502 가 난다(재현이 매우 어렵다). 톰캣은 application.yaml 에서
    #   keep-alive-timeout: 120s 로 명시했으므로 항상 nginx 가 먼저 닫는다.
    keepalive_timeout 30s;
}

# ── 액세스 로그(JSON) ─────────────────────────────────────────
# 미디어 UDP 를 뺀 모든 트래픽이 nginx 한 곳을 지나므로, 여기가 가장 싸고 빠짐없는 관측 지점이다.
# buffer/flush 로 매 요청마다 디스크를 치지 않게 한다(비용을 거의 0으로 만드는 부분).
# rid: 앱 로그의 traceId 와 같은 값 — 이걸로 엣지와 앱 로그를 이어 붙인다.
#
# uri 와 req 를 <b>둘 다</b> 남기는 이유:
#   $uri 는 rewrite 이후 값이라 SPA fallback 때문에 /room/42 도 /lobby 도 전부 "/index.html"
#   한 줄로 뭉개진다(실측 확인: `GET /` 요청이 로그에는 uri=/index.html 로 남았다).
#   그것만 보면 "사람들이 어느 화면에서 이탈했나"를 영영 알 수 없다.
#   $request_masked 는 원본 요청줄이고, 위에서 만든 마스킹 map 을 그대로 재사용하므로
#   LiveKit 의 ?access_token=<JWT> 은 여기서도 가려진다 — 새 map 을 만들 필요가 없다.
log_format json_beta escape=json '{'
  '"ts":"$time_iso8601",'
  '"rid":"$request_id",'
  '"ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"req":"$request_masked",'
  '"status":$status,'
  '"req_time":$request_time,'
  '"ups_time":"$upstream_response_time",'
  '"ups_conn":"$upstream_connect_time",'
  '"ups_status":"$upstream_status",'
  '"bytes":$body_bytes_sent,'
  '"ua":"$http_user_agent"'
'}';

# RUM 비콘 전용 형식 — 쿼리스트링($args)에 클라이언트가 보낸 지표가 들어 있다.
log_format rum_beta escape=json '{'
  '"ts":"$time_iso8601","ip":"$remote_addr","q":"$args","ua":"$http_user_agent"'
'}';

# /rum 전용 레이트리밋(-153). 이 엔드포인트는 인증이 없고 <b>임의 문자열을 호스트 디스크에</b>
# 적으므로, 그대로 두면 한 명이 루프 한 줄로 디스크를 채울 수 있다. 디스크가 차면 MySQL 쓰기가
# 실패해 전체가 멈춘다 — 우리 사망 시나리오 중 하나다. 참가자가 전원 개발자라 더 그렇다.
#
# ⚠ 다른 경로에는 limit_req 를 걸지 않았다. 정상 트래픽을 거절할 위험이 있어서다.
#   /rum 은 이번에 새로 만든 경로라 기존 동작을 깨뜨릴 여지가 없고, 넘치면 거절이 아니라
#   204(성공과 같은 응답)로 돌려보내므로 정상 클라이언트는 차이를 느끼지 못한다.
#
# 정상 사용량: 부팅 1 + 하트비트 1/분 + 에러 최대 5/세션 → 분당 12건이면 충분히 넉넉하다.
limit_req_zone $binary_remote_addr zone=rum:10m rate=12r/m;

# ── 접근 로그에서 토큰 가리기 ────────────────────────────────
# LiveKit SDK 는 접속 토큰을 헤더가 아니라 쿼리스트링(?access_token=<JWT>)으로 보낸다.
# $request 는 쿼리까지 그대로 적으므로, 로그 파일이나 docker logs 를 볼 수 있는 사람은 누구나
# 그 토큰을 복사해 남의 방에 들어갈 수 있다(토큰 수명 동안 유효).
# 요청 자체는 그대로 남기고 토큰 값만 가린다 — 어떤 방에 누가 붙었는지는 계속 추적할 수 있어야 한다.
map $request $request_masked {
    ~^(?<pre>.*)access_token=[^&\s]*(?<post>.*)$   "${pre}access_token=***${post}";
    default                                        $request;
}

# 응답시간 측정 + 토큰 마스킹을 한 포맷에 담는다. $request 대신 $request_masked 를 쓰는 것만 다르고
# 필드 구성은 그대로다.
log_format timed '$remote_addr [$time_local] "$request_masked" $status '
                 'req=$request_time up=$upstream_response_time '
                 'body=$request_length';

# ⚠ access_log 는 여기(http)가 아니라 각 server 안에서 건다. nginx.conf 기본 설정에 이미 http 레벨
#    access_log(main 포맷)가 있는데, 같은 레벨의 access_log 는 서로를 대체하지 않고 <b>둘 다</b> 기록한다.
#    여기에 걸면 마스킹된 줄 옆에 마스킹 안 된 기본 줄이 나란히 남아 토큰이 그대로 새어 나간다.
#    server 레벨에 걸어야 상속이 끊겨 이 포맷 하나만 남는다.

# ── HTTP(80): 인증서 검증(ACME) + HTTPS 강제 리다이렉트 ──
server {
    # backlog: 커널 somaxconn 은 실측 4096 인데 nginx 기본값이 511 이라 그게 실질 상한이었다.
    # 2000명이 동시에 재연결하면 512번째부터 그냥 버려진다(-153).
    listen 80 backlog=4096;
    server_name motok.co.kr;

    # ⚠ 경로를 /dev/stdout 으로 <b>명시</b>한다. 이미지의 /var/log/nginx/access.log 는 원래
    #   /dev/stdout 심볼릭 링크였는데, 이번에 /srv/motok/logs/nginx 를 그 디렉터리에 마운트하면서
    #   링크가 가려진다. 그대로 두면 이 로그가 docker logs 에서 사라진다 — 지금까지 nginx 문제를
    #   보던 경로가 조용히 끊기는 회귀다. 명시하면 마운트 여부와 무관하게 동작이 같다.
    access_log /dev/stdout timed;

    # certbot 도메인 소유 검증 경로 (발급·갱신 시 Let's Encrypt 가 접속)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 전부 HTTPS 로
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443): TLS 종료 후 백엔드로 프록시 ──
server {
    listen 443 ssl backlog=4096;
    http2 on;
    server_name motok.co.kr;

    client_max_body_size 10m;

    # 응답시간 + 토큰 마스킹 포맷 (위 log_format 참고). server 레벨이라 기본 access_log 를 대체한다.
    # ⚠ 경로를 /dev/stdout 으로 <b>명시</b>한다. 이미지의 /var/log/nginx/access.log 는 원래
    #   /dev/stdout 심볼릭 링크였는데, 이번에 /srv/motok/logs/nginx 를 그 디렉터리에 마운트하면서
    #   링크가 가려진다. 그대로 두면 이 로그가 docker logs 에서 사라진다 — 지금까지 nginx 문제를
    #   보던 경로가 조용히 끊기는 회귀다. 명시하면 마운트 여부와 무관하게 동작이 같다.
    access_log /dev/stdout timed;

    # 관측용 JSON 로그(-153). 위 마스킹 로그와 <b>병행</b>한다 — 같은 레벨의 access_log 는
    # 서로를 대체하지 않고 둘 다 기록되므로, 여기서 토큰이 새지 않는지가 중요하다.
    # $uri 는 쿼리스트링을 포함하지 않는다($request_uri 와 다르다) — LiveKit 의
    # ?access_token=<JWT> 가 이 파일에는 들어오지 않는다.
    access_log /var/log/nginx/beta.json.log json_beta buffer=64k flush=5s;

    # Let's Encrypt 인증서 (certbot 이 발급/갱신)
    ssl_certificate     /etc/letsencrypt/live/motok.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motok.co.kr/privkey.pem;

    # TLS 보안 옵션 (인라인 — 별도 파일 의존 없음)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 보안 헤더 ────────────────────────────────────────────
    # ⚠ nginx 의 add_header 는 "하위 블록에 add_header 가 하나라도 있으면 상속되지 않는다".
    #    아래 /assets/ 와 =/index.html 은 Cache-Control 을 직접 붙이므로 거기서 이 헤더들을 다시 선언한다.
    #    (빠뜨리면 정작 HTML 문서에 CSP 가 안 붙어 정책 전체가 무력화된다)
    #
    # CSP 로 막고 싶은 것: XSS 로 심어진 스크립트가 (1) 실행되는 것, (2) 토큰·화면 내용을 외부로 보내는 것.
    #  - script-src 'self'          : 인라인 스크립트·외부 스크립트 전면 금지. index.html 에 인라인이 없어 가능하다.
    #  - 'wasm-unsafe-eval'         : MediaPipe(손·자세 인식)가 wasm 을 컴파일하려면 필요하다. 이게 없으면 게임이 통째로 안 뜬다.
    #  - style-src 'unsafe-inline'  : Vue 의 :style 바인딩이 인라인 style 속성을 만든다. 빼면 화면이 깨진다.
    #  - font-src 'self'            : 픽셀 폰트는 자체 호스팅(/fonts/). CDN 에서 받으려면 style-src 도 함께 열어야 한다.
    #  - connect-src 'self'         : REST·STOMP(wss://<도메인>/ws)·LiveKit(wss://<도메인>/livekit) 모두 같은 오리진이다.
    #  - *.amazonaws.com            : 아바타 이미지(S3_PUBLIC_BASE_URL)와 업로드 presigned PUT.
    #    ⚠ S3_PUBLIC_BASE_URL 이 CloudFront 등 다른 도메인이면 여기에 그 도메인을 추가해야 아바타가 안 뜬다.
    #  - frame-ancestors 'none'     : 남의 페이지에 iframe 으로 끼워 클릭을 가로채는 것(클릭재킹) 차단.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.amazonaws.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options  nosniff always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # 공통 프록시 헤더 (아래 /ws 는 자체 헤더를 두므로 따로 다시 선언)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # nginx 자신의 상태(-153). active connections 로 커넥션 슬롯 고갈을 판정한다.
    # 로컬·도커 네트워크에서만 열고 SSH 터널로 본다.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        access_log off;
    }

    # RUM 비콘 수신(-153). 앱으로 넘기지 않고 nginx 가 로그에만 남기고 끝낸다.
    #  - 앱을 거치지 않으므로 <b>앱이 죽어도 기록된다</b> (그때가 가장 알고 싶은 순간이다)
    #  - 문제가 생기면 return 444 로 바꾸고 reload — 프론트 재배포가 필요 없다
    #  - 이 블록이 없으면 SPA fallback 에 걸려 비콘마다 index.html 이 응답된다
    location = /rum {
        # 넘치면 429. (204 로 돌려보내고 싶었지만 limit_req_status 는 400~599 만 받는다 —
        # nginx 가 [emerg] 로 기동을 거부한다.) 기본값 503 대신 429 를 쓰는 이유는
        # 사후 분석에서 "서버가 아팠다(5xx)"와 "레이트리밋에 걸렸다"를 구분하기 위해서다.
        # 프론트(useRum.ts)는 비콘 응답 코드를 보지 않고 실패해도 무시하므로 재시도 폭주는 없다.
        limit_req zone=rum burst=10 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/rum.json.log rum_beta buffer=32k flush=5s;
        # ⚠ `return 204` 가 아니라 empty_gif 다. 이유가 미묘한데 중요하다 —
        #   nginx 는 요청을 단계별로 처리하고 return 은 REWRITE 단계, limit_req 는 그보다
        #   <b>뒤인</b> PREACCESS 단계에서 돈다. return 을 쓰면 REWRITE 에서 응답이 끝나 버려
        #   limit_req 가 아예 실행되지 않는다 — 설정은 있는데 조용히 아무 일도 안 한다.
        #   (실측으로 확인했다: return 204 일 때 한도의 2배를 연달아 쏴도 전부 통과했다)
        #   empty_gif 는 CONTENT 단계의 핸들러라 PREACCESS 를 정상적으로 거친다.
        #   응답은 204 대신 43바이트 GIF 가 되지만 프론트는 응답을 보지 않으므로 차이가 없다.
        empty_gif;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 앱 로그의 traceId 와 이어진다(TraceIdFilter). nginx 로그의 rid 와 같은 값이다.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;      # 나머지는 기본값 수준
    }

    location = /api/games/draw/judge {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # ⚠ 이 블록은 `=` 정확일치라 위의 `location /api/` 보다 우선한다 — 즉 /api/ 에 넣은
        #   설정이 여기에는 상속되지 않는다. 추적 헤더를 빠뜨리면 하필 <b>가장 느린 엔드포인트</b>의
        #   nginx 로그와 앱 로그를 이어 붙일 수 없게 된다. (덤으로, 없으면 클라이언트가 보낸
        #   X-Request-Id 가 그대로 앱까지 통과한다)
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Swagger (API 문서)
    location /swagger-ui/     { proxy_pass http://backend; }
    location /swagger-ui.html { proxy_pass http://backend; }
    location /v3/api-docs     { proxy_pass http://backend; }

    # WebSocket (STOMP 핸드셰이크). Upgrade 헤더 필요 →
    # 이 블록에 proxy_set_header 가 있으면 server 레벨 헤더 상속이 끊기므로 공통 헤더도 다시 명시.
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 3600s;   # 롱커넥션 유지
    }

    # LiveKit SFU 시그널링 (wss, -30). 클라 SDK 가 wss://<도메인>/livekit/rtc?... 로 접속
    # → /livekit prefix 를 떼고 컨테이너로 전달. 미디어(UDP 50000-50100)는 nginx 를 거치지 않는다.
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;   # 롱커넥션 유지
    }

    # ── 프론트엔드 SPA (deploy-frontend job 이 /srv/motok/frontend 에 dist 배치) ──
    root  /usr/share/nginx/html;
    index index.html;

    # 해시된 정적 자산(js/css/이미지)은 파일명이 매 빌드 바뀌므로 장기 캐시
    # (add_header 를 쓰는 순간 server 레벨 보안 헤더 상속이 끊기므로 여기서 다시 선언)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options  nosniff always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }

    # ⚠ immutable 금지 — 파일명이 @mediapipe/tasks-vision 고정 이름이라 같은 이름으로 교체된다.
    #    낡은 wasm + 새 JS 래퍼는 게임이 아예 안 뜬다. 30일은 그 위험의 상한이고,
    #    없애려면 경로에 버전을 넣어야 한다(/mediapipe/v1/ + use*Landmarker.ts 의 경로 상수).
    #    (프론트는 Cache Storage 에도 저장한다: modelCache.ts 의 CACHE_NAME 버전도 같이 올릴 것)
    location /mediapipe/ {
        expires 30d;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options  nosniff always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }

    # public/ 자산은 dist 루트로 복사돼 /assets/ 에 걸리지 않는다
    # ⚠ 빌드 해시가 없으므로 폰트 교체 시 파일명(DNFBitBitv2)을 함께 올려야 캐시가 무효화된다
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options  nosniff always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }

    # index.html 은 캐시 금지 → 새 배포가 즉시 반영됨
    # 정책이 실제로 적용되는 문서라 보안 헤더를 반드시 다시 붙여야 한다(위 주석 참고).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options  nosniff always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }

    # SPA 라우팅: 실제 파일 없으면 index.html 로 폴백 (vue-router history 모드)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
